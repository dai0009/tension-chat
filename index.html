<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理コミュニケーション</title>
  <script>
    const files = [
      "chat-auto.html",
      "chat-button.html",
      "chat-free.html"
    ];
    const conditions = ['A', 'B', 'C'];
    const random = Math.floor(Math.random() * files.length);
    const condition = conditions[random];
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let suffix = '';
    for (let i = 0; i < 8; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
    const participantId = condition + '-' + suffix;
    localStorage.setItem('tc_participant_id', participantId);
    localStorage.setItem('tc_condition', condition);
    window.location.replace(files[random]);
  </script>
</head>
<body>
  <p>読み込み中...</p>
</body>
</html>
